[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privacyaudit"
version = "0.5.0"
description = "Open-source Python library to audit ML pipelines for privacy vulnerabilities — MIA, PII leakage, model inversion risk scoring"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Nithin", email = "kumbam.nithingoud@gmail.com" }]
keywords = ["privacy", "machine-learning", "membership-inference", "pii", "model-auditing", "gdpr", "ai-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.0,<9.0",
    "rich>=13.0.0,<14.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0,<3.0",
    "scikit-learn>=1.3.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
torch = ["torch>=2.0.0"]
xgboost = ["xgboost>=2.0.0"]
transformers = ["transformers>=4.35.0", "torch>=2.0.0"]
all = ["torch>=2.0.0", "xgboost>=2.0.0", "transformers>=4.35.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
]

[project.scripts]
privacylens = "privacylens.cli:main"

[project.urls]
Homepage = "https://github.com/nithin42/privacylens"
Documentation = "https://github.com/nithin42/privacylens#readme"
Repository = "https://github.com/nithin42/privacylens"
Issues = "https://github.com/nithin42/privacylens/issues"
Changelog = "https://github.com/nithin42/privacylens/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503", "E501"]

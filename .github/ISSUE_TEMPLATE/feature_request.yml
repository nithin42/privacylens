name: Feature Request
description: Suggest a new audit check or enhancement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      placeholder: What privacy risk is not currently covered?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      placeholder: How would you implement or use this feature?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Membership Inference
        - PII Leakage
        - Model Inversion
        - New Framework Adapter
        - CLI
        - Reporting
        - Other
